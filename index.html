<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方最新发布页 - 防失联</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; text-align: center; padding: 50px 20px; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; font-size: 14px; }
        .btn { display: block; background: #007bff; color: white; padding: 12px; margin: 15px 0; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0056b3; }
        .emergency { background: #dc3545; }
        .emergency:hover { background: #bd2130; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📢 官方永久发布页</h1>
        <p>请Ctrl+D收藏本页，防止失联！</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <!-- 替换为你的最新下载链接或主站链接 -->
        <a href="https://www.hyperlanx.com" class="btn" target="_blank">🌐 进入官方主站</a>
        <a href="https://www.hyperlanx.net" class="btn" target="_blank">🌐 备用主站地址</a>
        <a href="https://t.me" class="btn" style="background:#229ED9;" target="_blank">✈️ Telegram 官方群组</a>
        
        <!-- 备用紧急通道 -->
        <a href="mailto:your-email@example.com" class="btn emergency">📧 紧急联系邮箱</a>
    </div>
</body>
</html>
